name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install Flutter 3.47.4
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          flutter --version
          go version
          pod --version || brew install cocoapods
          xcodebuild -version

      - name: Build macOS universal app
        id: build
        continue-on-error: true
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: "off"
        run: |
          set -o pipefail
          python3 scripts/build_macos.py --all-sources 2>&1 | tee build.log

      - name: Publish build log
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || true
          git checkout -B logs
          if [ -f /tmp/build.log ]; then cp /tmp/build.log build-log.txt; else echo "(no build log)" > build-log.txt; fi
          git add -f build-log.txt
          git commit -m "build log for run ${{ github.run_number }}" || true
          git push -f origin logs || true

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-macos
          path: dist/macos/*.zip
          retention-days: 30

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-build-${{ github.run_number }}
          name: "真果鉴 macOS 构建 #${{ github.run_number }}"
          body: |
            真果鉴 macOS 通用版（Apple Silicon + Intel，未签名）。

            使用方法：解压 zip 后，先在终端执行一次（去除网络下载隔离标记）：

                xattr -cr zhenguojian.app
                open zhenguojian.app

            或 Finder 中右键 → 打开（首次）。

            站源解锁与 Windows 版一致：左侧「最近观看」连点 6 次 → 「不使用密码」，共 23 个站源。
          files: dist/macos/*.zip

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
